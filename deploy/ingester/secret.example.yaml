# Ingester secrets. DO NOT COMMIT REAL VALUES.
#
#   cp secret.example.yaml secret.yaml   # secret.yaml is gitignored
#   # edit secret.yaml, then:
#   kubectl -n <namespace> apply -f secret.yaml
#
# Two auth modes for RabbitMQ (pick one):
#
#  (A) TOKEN mode (matches the OSG shoveler): put the JWT/token bytes in the
#      `token` key. The ingester reads it as username "shoveler" and re-reads it
#      on mtime change. Keep INGESTER_AMQP_URL (ConfigMap) WITHOUT userinfo.
#
#  (B) PLAIN mode: leave `token` empty and instead override INGESTER_AMQP_URL
#      here with embedded credentials (amqps://user:pass@host/vhost). If you set
#      it here it overrides the ConfigMap value.
apiVersion: v1
kind: Secret
metadata:
  name: ingester-secrets
  labels:
    app.kubernetes.io/name: osdf-clickhouse-ingester
    app.kubernetes.io/part-of: osdf-clickhouse
type: Opaque
stringData:
  # (A) TOKEN mode: paste the broker token here (mounted at
  #     /etc/ingester/amqp-token/token).
  token: "REPLACE_WITH_BROKER_TOKEN_OR_LEAVE_FOR_PLAIN_MODE"

  # ClickHouse application-user password (mounted at /etc/ingester/ch/password).
  # MUST match clickhouse-credentials.ingester-password.
  ch-password: "REPLACE_WITH_CLICKHOUSE_INGESTER_PASSWORD"

  # (B) PLAIN mode only: uncomment to override the broker URL with credentials.
  # INGESTER_AMQP_URL: "amqps://shoveler:PASSWORD@osg-broker.example.org:5671/%2f"
