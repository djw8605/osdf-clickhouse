# ClickHouse application-user credentials.
#
# DO NOT COMMIT REAL SECRETS. Copy this file to secret.yaml, replace the
# placeholder values, and apply it. secret.yaml is gitignored.
#
#   cp secret.example.yaml secret.yaml
#   # edit secret.yaml, then:
#   kubectl -n <namespace> apply -f secret.yaml
#
# The CHI (clickhouse-installation.yaml) references these keys via
# valueFrom.secretKeyRef, so the password is never written into the CR.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  labels:
    app.kubernetes.io/part-of: osdf-clickhouse
type: Opaque
stringData:
  # Application user used by the ingester to INSERT (and by read clients).
  ingester-password: "REPLACE_WITH_A_STRONG_PASSWORD"
  # Read-only user for Grafana / ad-hoc queries.
  reader-password: "REPLACE_WITH_ANOTHER_STRONG_PASSWORD"
